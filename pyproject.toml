[project]
name = "services"
dynamic = ["version"]
description = "cloudera.services Ansible collection"
readme = "README.md"
requires-python = ">=3.9" # hatch-semver requires 3.9+
license = "Apache-2.0"
keywords = []
authors = [
  { name = "Webster Mudge", email = "wmudge@cloudera.com" },
  { name = "Jim Enright", email = "jenright@cloudera.com" },
  { name = "Ronald Suplina", email = "rsuplina@cloudera.com" }
]
classifiers = []
dependencies = [
  # Runtime dependencies of the collection. Keep in sync with requirements.txt.
  # NOTE: ansible-core is intentionally omitted here (it is the runtime platform,
  # provided by the execution environment)
  "apache-atlas >=0.0.15",
  "apache-ranger >=0.0.12",
  "nipyapi >=1.5.0",
  "kafka-python >=2.3.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.version]
path = "galaxy.yml"
pattern = "version:\\s+(?P<version>[\\d\\.]+)"
scheme = "semver"
validate-bump = true

[tool.hatch.envs.default]
# The project is installed (dev mode) so its runtime dependencies from
# [project.dependencies] are pulled in automatically -- keeping that table the
# single source of truth. Utility dependencies below live only in Hatch envs.
extra-dependencies = [
  "ansible-core<2.17", # For RHEL 8 support
  "pre-commit",
  "pytest",
  "pytest-mock",
  "ansible-lint",
  "antsibull-docs >= 2.0.0, < 3.0.0",
]

[tool.hatch.envs.default.scripts]
lint = [
  "pre-commit run -a",
  "antsibull-docs lint-collection-docs --plugin-docs --validate-collection-refs=all --skip-rstcheck ."
]

[tool.hatch.envs.hatch-test]
matrix-name-format = "{variable}_{value}"
extra-dependencies = [
  "pytest-mock",
  "molecule",
  "molecule-plugins",
  "molecule-plugins[ec2]",
  # "ansible-core<2.17", # Handled by matrix overrides
]

[tool.hatch.envs.hatch-test.scripts]
run = [
    "pytest{env:HATCH_TEST_ARGS:} {args}"
]

# Ansible 2.18 - Python >= 3.11
[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14", "3.13", "3.12", "3.11"]
ansible = ["2.18"]

# Ansible 2.17 - Python >= 3.10
[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14", "3.13", "3.12", "3.11", "3.10"]
ansible = ["2.17"]

# Ansible 2.16 - Python >= 3.10
[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14", "3.13", "3.12", "3.11", "3.10"]
ansible = ["2.16"]

# Ansible 2.15 - Python <= 3.12, >=3.10
[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12", "3.11", "3.10"]
ansible = ["2.15"]

[tool.hatch.envs.hatch-test.overrides]
matrix.ansible.dependencies = [
  { value = "ansible-core==2.18", if = ["2.18"] },
  { value = "ansible-core==2.17", if = ["2.17"] },
  { value = "ansible-core==2.16", if = ["2.16"] },
  { value = "ansible-core==2.15", if = ["2.15"] },
]

[tool.hatch.envs.docs]
python = "3.12"
detached = true
builder = true
extra-dependencies = [
  "ansible-core<2.17",     # For RHEL 8 support
  "antsibull-docs @ git+https://github.com/cloudera-labs/antsibull-docs@cldr-docsite#egg=antsibull-docs",
  "ansible-pygments",
  "sphinx",
  "sphinx-ansible-theme>=0.9.0",
  "antsichaut",
]

[tool.hatch.envs.docs.scripts]
build = "cd docsbuild; ./build.sh"
changelog = [
  # Read the version in galaxy.yml via hatch itself (normalizes release candidates, etc.)
  # Use 'hatch version' to manage the version, i.e. 'hatch version major,rc'
  "antsibull-changelog release --version $(hatch version)",
  "antsichaut --repository cloudera-labs/cloudera.services --since_version=latest",
  "antsibull-changelog generate",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
filterwarnings = [
  "ignore:AnsibleCollectionFinder has already been configured",
  "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
  "ignore:ssl.PROTOCOL_TLS is deprecated" # kafka-python
]
markers = [
  "slow: marks tests as slow tests",
  "data_service: marks tests that require an existing Data Service environment",
  "all: marks all tests to run",
]
addopts = [
  "-m not slow and not data_service", # skip slow and data_service-dependent tests by default
]

[tool.ruff.lint.per-file-ignores]
# Ansible modules must define the DOCUMENTATION, EXAMPLES, and RETURN string
# constants before any imports (the Ansible community convention, enforced by
# `ansible-test sanity`), so module-level imports intentionally do not appear at
# the top of the file. Allow that layout for module plugins.
"plugins/modules/**/*.py" = ["E402"]

[build-system]
requires = [
  "hatchling",
  "hatch-semver",
]
build-backend = "hatchling.build"
