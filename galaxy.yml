---

namespace: cloudera
name: services
version: 1.1.0
readme: README.md
authors:
- Webster Mudge <wmudge@cloudera.com>
- Jim Enright <jenright@cloudera.com>
- Ronald Suplina <rsuplina@cloudera.com>

description: >
  A set of modules and other resources that interact with the execution (compute and/or data
  management) services and endpoints provided by Cloudera Data Platform (CDP) Public Cloud
  and Private Cloud deployments.
license:
- Apache-2.0
tags:
- cloudera
- cdp
- atlas
- ranger
- cml
- ssm
- ssb
- hive
- impala
- efm
- nifi
- schema_registry
- kafka
- flink

dependencies: {}

repository: https://github.com/cloudera-labs/cloudera.services
documentation: https://cloudera-labs.github.io/cloudera.services
homepage: https://github.com/cloudera-labs/cloudera.services
issues: https://github.com/cloudera-labs/cloudera.services/issues

build_ignore:
  - ".*"
  - "*.log"
  - "*.tar.gz"
  - docs
  - docsbuild
  - tests
  - pytest.ini
  - builder
